standards:
- id: iso-9001-2015
  conforms: true
  evidence:
    url: https://www.mobilionsystems.com/quality-management
    quote: >-
      "MOBILion Systems has successfully achieved the ISO 9001:2015 certification for our exceptional
      quality management systems."
    certifying_body: DEKRA
    achieved: '2023-06-09'
    expires: '2026-06-08'
    caveat: >-
      the certificate window the company itself publishes ended 2026-06-08, which is before the date
      of this probe (2026-08-25). A recertification may well have happened; the page had not been
      updated to say so. Recorded as published, with the published dates.
- id: hdf5
  conforms: true
  evidence:
    what: >-
      the .mbi file format is an HDF5 container. MBIFileHDF5Adapter.h is the SDK's low-level adapter,
      ERR_HDF5_FILE_ERROR is a first-class error code, and the Linux packages and Python wheel bundle
      libhdf5.so.200 / libhdf5_cpp.so.200. COPYING.txt in the SDK repository is the HDF5 license.
    url: https://github.com/MOBILionSystems/MOBILion_MBI_SDK/blob/main/COPYING.txt
  note: >-
    HDF5 is the container, not a domain data standard. The scientific payload inside it is
    MOBILion-proprietary and is not self-describing to a generic HDF5 reader.
- id: scipy-sparse-csr
  conforms: true
  evidence:
    what: >-
      GetFrameDataAsCSRComponents() returns data/indices/indptr in exactly SciPy's CSR triple order,
      documented by the vendor as going straight into csr_matrix / csr_array with no rearrangement.
    url: https://github.com/MOBILionSystems/MOBILion_MBI_SDK/blob/main/README.md#reading-a-frame-in-python
  note: a de-facto numerical interchange convention, not a ratified standard.
domain_standard_conformance:
- id: mzml-hupo-psi
  conforms: false
  evidence:
    what: >-
      mzML (and imzML) is the HUPO-PSI open interchange standard for mass-spectrometry data and is the
      domain standard a buyer in this market would ask for. MOBILion publishes NO mzML writer, no
      converter and no mzML claim of its own. Conversion out of .mbi is done by ProteoWizard
      msconvert, a THIRD-PARTY tool, which lists MOBILion alongside AB SCIEX, Agilent, Bruker,
      Shimadzu, Thermo and Waters raw formats.
    third_party_url: https://proteowizard.sourceforge.io/download.html
  note: >-
    this is the one domain-standard slot that genuinely applies to this market, and it is unmet by the
    vendor. The practical consequence for an integrator is that the first-party path (.mbi + the MBI
    SDK) is proprietary and license-gated, and the open-standard path exists only because a
    third-party project built it. REWARD-ONLY — no penalty is implied by recording the absence.
- id: imzml
