note: >-
  MOBILion publishes exactly one first-party developer package family: the MOBILion MBI SDK, a native
  library for reading the HDF5-backed .mbi files written by the MOBIE EyeOn acquisition system. It is
  distributed ONLY as binaries committed into the public GitHub repository — there is no npm, PyPI,
  NuGet, Maven, crates.io, RubyGems or Packagist listing, and no GitHub Release or tag. All of
  pypi.org/pypi/mbisdk, pypi.org/pypi/mbi-sdk, pypi.org/pypi/mobilion-mbi, api.nuget.org (MBISDK,
  MBISDK.NET, MOBILion.MBISDK) and registry.npmjs.org/mbisdk returned 404 on 2026-08-25, so no
  registry metadata endpoint exists to read a version or a release date from. Versions and dates below
  are therefore read from the artifact filenames, the README release banner and the repository commit
  history rather than from a registry.
