  url: https://github.com/MOBILionSystems/MOBILion_MBI_SDK/tree/main/lib/linux-x64/swig-python
  version: 1.13.0.11740
  published: '2026-08-13'
  platforms: [linux-x64, windows-x64]
  artifacts:
  - lib/linux-x64/swig-python/mbisdk-1.13.0.11740-cp39-cp39-linux_x86_64.whl
  - lib/win-x64/swig-python/mbisdk.py
  - lib/win-x64/swig-python/_mbisdk.pyd
  install: pip install mbisdk-1.13.0.11740-cp39-cp39-linux_x86_64.whl
  note: >-
    SWIG-generated bindings. The Linux wheel is tagged cp39-cp39, so pip installs it on CPython 3.9
    ONLY, despite broader classifiers in the package metadata — the README says so explicitly. The
    wheel bundles libhdf5.so.200 / libhdf5_cpp.so.200 via a $ORIGIN runpath and needs no system HDF5.
    Its 1.13.0 version label is the same mislabel as the Linux packages; the code is 1.13.1. Windows
    bindings are loose files, not a wheel — put the directory on sys.path with MBI_SDK.dll findable.
