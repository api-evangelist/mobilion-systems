aid: mobilion-systems
name: MOBILion Systems
description: 'MOBILion Systems is a separation-science instrument company founded in 2015 and headquartered
  in Chadds Ford, Pennsylvania. It is the exclusive commercial licensee of SLIM (Structures for Lossless
  Ion Manipulation) and builds MOBIE, a high-resolution ion mobility (HRIM) platform that couples a serpentine
  ~13-metre ion path to third-party mass spectrometers for glycan, lipid, peptide, PFAS, lipid-nanoparticle
  and biotherapeutic characterisation. Its developer surface is not a web API: the MOBIE EyeOn acquisition
  system writes an HDF5-backed proprietary MBI file, and MOBILion publishes a first-party native SDK for
  reading it — a C++ library for Windows and Linux with SWIG-generated Python bindings and a mixed-mode
  .NET wrapper, shipped with a full Doxygen API reference from the MOBILionSystems GitHub organization.'
